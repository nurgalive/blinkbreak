repos:
# Pre-commit update: automatically update pre-commit hooks
-   repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.9.0
    hooks:
    -   id: pre-commit-update

# Pre-commit's own basic hooks
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

# cspell: spell checking for comments and docstring
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell
        args: ["--ignore-words", "cspell_words.txt", "--skip", "compile_commands.json"]

# Detect secrets: prevent committing secrets accidentally
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets

# Markdownlint: linting for Markdown files
-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
    -   id: markdownlint
        args: [--disable=MD013]
